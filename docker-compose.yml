services:
  kuma-lite:
    image: kuma-lite:latest
    container_name: kuma-lite
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/kuma-lite.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
